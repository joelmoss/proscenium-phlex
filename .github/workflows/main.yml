name: main
on: [push]

permissions:
  contents: read

# Other branches cancel superseded runs. Every master commit gets a full run, so each has its own
# group: a shared group would still cancel a waiting run when a newer one is queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.4"
          - "4.0"
        gemfile:
          - phlex1_rails7
          - phlex1_rails8
          - phlex1_rails81
          - phlex2_rails7
          - phlex2_rails8
          - phlex2_rails81

    env:
      RAILS_ENV: test
      # Set at job level so setup-ruby installs and caches this appraisal's bundle.
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile

    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rails test

  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop -P --fail-level C
